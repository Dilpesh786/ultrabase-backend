<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraBase Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid #334155; padding-bottom: 20px; }
        h1 { color: #38bdf8; margin: 0; font-size: 28px; }
        .status-card { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #22c55e; color: #000; font-weight: bold; padding: 4px 10px; border-radius: 20px; font-size: 14px; }
        .section { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 25px; border: 1px solid #334155; }
        h2 { color: #f43f5e; margin-top: 0; font-size: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; font-size: 14px; }
        th { background-color: #0f172a; color: #38bdf8; }
        tr:hover { background-color: #334155; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 8px 16px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0284c7; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ UltraBase Live Admin Dashboard</h1>
            <p style="color: #94a3b8;">તમારા PostgreSQL ડેટાબેઝમાંથી લાઈવ યુઝર્સ અને UTR રેકોર્ડ્સ</p>
        </header>

        <div class="status-card">
            <div>
                <strong>સર્વર સ્ટેટસ:</strong> <span id="server-status">તપાસી રહ્યા છીએ...</span>
            </div>
            <button onclick="loadData()">🔄 Refresh Data</button>
        </div>

        <div class="section">
            <h2>👥 Registered Users (<span id="user-count">0</span>)</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Email</th>
                        <th>Created At</th>
                    </tr>
                </thead>
                <tbody id="users-table">
                    <tr><td colspan="3">ડેટા લોડ થઈ રહ્યો છે...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="section">
            <h2>💳 UTR Submissions (<span id="utr-count">0</span>)</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>User Email</th>
                        <th>UTR Number</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="utr-table">
                    <tr><td colspan="5">ડેટા લોડ થઈ રહ્યો છે...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                // Fetch API Status
                const statusRes = await fetch('/api/status');
                const statusData = await statusRes.json();
                document.getElementById('server-status').innerHTML = `<span class="badge">${statusData.status}</span>`;

                // Fetch Users
                const usersRes = await fetch('/api/admin/users');
                const users = await usersRes.json();
                document.getElementById('user-count').innerText = users.length;
                let userHtml = '';
                if(users.length === 0) {
                    userHtml = '<tr><td colspan="3">હજુ સુધી કોઈ યુઝર નોંધાયેલ નથી.</td></tr>';
                } else {
                    users.forEach(u => {
                        userHtml += `<tr><td>${u.id}</td><td>${u.email}</td><td>${new Date(u.created_at).toLocaleString()}</td></tr>`;
                    });
                }
                document.getElementById('users-table').innerHTML = userHtml;

                // Fetch UTRs
                const utrRes = await fetch('/api/admin/utrs');
                const utrs = await utrRes.json();
                document.getElementById('utr-count').innerText = utrs.length;
                let utrHtml = '';
                if(utrs.length === 0) {
                    utrHtml = '<tr><td colspan="5">હજુ સુધી કોઈ UTR સબમિટ થયેલ નથી.</td></tr>';
                } else {
                    utrs.forEach(utr => {
                        utrHtml += `<tr><td>${utr.id}</td><td>${utr.email}</td><td><strong>${utr.utr_number}</strong></td><td><span style="color:#22c55e;">${utr.status}</span></td><td>${new Date(utr.created_at).toLocaleString()}</td></tr>`;
                    });
                }
                document.getElementById('utr-table').innerHTML = utrHtml;

            } catch (err) {
                console.error("Error loading dashboard data:", err);
                document.getElementById('server-status').innerText = 'Error Connecting to Server';
            }
        }

        // Auto load on page start
        loadData();
    </script>
</body>
</html>
