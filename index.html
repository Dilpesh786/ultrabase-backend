<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraBase Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; border-bottom: 1px solid #334155; padding-bottom: 20px; }
        h1 { color: #38bdf8; font-size: 26px; margin-bottom: 8px; }
        .status-badge { display: inline-block; padding: 6px 12px; background-color: #22c55e; color: #000; font-weight: bold; border-radius: 20px; font-size: 14px; }
        .card { background-color: #1e293b; border-radius: 10px; padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .card-title { color: #f43f5e; font-size: 18px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #334155; }
        th { background-color: #0f172a; color: #94a3b8; }
        tr:hover { background-color: #334155; }
        .btn { background-color: #38bdf8; color: #0f172a; border: none; padding: 6px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:hover { opacity: 0.8; }
        .btn-approve { background-color: #22c55e; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-right: 4px; }
        .btn-reject { background-color: #f59e0b; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; margin-right: 4px; }
        .btn-delete { background-color: #ef4444; color: white; padding: 4px 8px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
        .status-Approved { color: #22c55e; font-weight: bold; }
        .status-Rejected { color: #ef4444; font-weight: bold; }
        .status-Pending { color: #f59e0b; font-weight: bold; }
        .empty-text { text-align: center; color: #94a3b8; padding: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ UltraBase Live Admin Dashboard</h1>
        <p>તમારા PostgreSQL ડેટાબેઝમાંથી લાઈવ યુઝર્સ અને UTR રેકોર્ડ્સ</p>
    </header>

    <div class="card">
        <div class="card-header">
            <div>સર્વર સ્ટેટસ: <span class="status-badge">Online & Operational</span></div>
            <button class="btn" onclick="fetchData()">🔄 Refresh Data</button>
        </div>
    </div>

    <!-- USERS TABLE -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">👥 Registered Users (<span id="user-count">0</span>)</div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Email</th>
                    <th>Created At</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="users-table-body">
                <tr><td colspan="4" class="empty-text">લોડ થઈ રહ્યું છે...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- UTR TABLE -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">💳 UTR Submissions (<span id="utr-count">0</span>)</div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>User Email</th>
                    <th>UTR Number</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="utr-table-body">
                <tr><td colspan="5" class="empty-text">લોડ થઈ રહ્યું છે...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    async function fetchData() {
        try {
            const response = await fetch('/api/admin/all-data');
            const data = await response.json();

            if (data.success) {
                // Render Users
                const userBody = document.getElementById('users-table-body');
                document.getElementById('user-count').innerText = data.users.length;
                if (data.users.length === 0) {
                    userBody.innerHTML = '<tr><td colspan="4" class="empty-text">હજુ સુધી કોઈ યુઝર નોંધાયેલ નથી.</td></tr>';
                } else {
                    userBody.innerHTML = data.users.map(u => `
                        <tr>
                            <td>${u.id}</td>
                            <td>${u.email}</td>
                            <td>${new Date(u.created_at).toLocaleString('gu-IN')}</td>
                            <td>
                                <button class="btn-delete" onclick="deleteUser(${u.id})">Delete</button>
                            </td>
                        </tr>
                    `).join('');
                }

                // Render UTRs
                const utrBody = document.getElementById('utr-table-body');
                document.getElementById('utr-count').innerText = data.utrs.length;
                if (data.utrs.length === 0) {
                    utrBody.innerHTML = '<tr><td colspan="5" class="empty-text">હજુ સુધી કોઈ UTR સબમિટ થયેલ નથી.</td></tr>';
                } else {
                    utrBody.innerHTML = data.utrs.map(u => `
                        <tr>
                            <td>${u.id}</td>
                            <td>${u.user_email}</td>
                            <td>${u.utr_number}</td>
                            <td class="status-${u.status}">${u.status}</td>
                            <td>
                                <button class="btn-approve" onclick="updateStatus(${u.id}, 'Approved')">Approve</button>
                                <button class="btn-reject" onclick="updateStatus(${u.id}, 'Rejected')">Reject</button>
                                <button class="btn-delete" onclick="deleteUtr(${u.id})">Delete</button>
                            </td>
                        </tr>
                    `).join('');
                }
            }
        } catch (err) {
            console.error('Error fetching data:', err);
        }
    }

    async function updateStatus(id, status) {
        await fetch('/api/admin/update-utr-status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, status })
        });
        fetchData();
    }

    async function deleteUser(id) {
        if (confirm('શું તમે આ યુઝરને ડિલીટ કરવા માંગો છો?')) {
            await fetch(`/api/admin/delete-user/${id}`, { method: 'DELETE' });
            fetchData();
        }
    }

    async function deleteUtr(id) {
        if (confirm('શું તમે આ UTR રેકોર્ડ ડિલીટ કરવા માંગો છો?')) {
            await fetch(`/api/admin/delete-utr/${id}`, { method: 'DELETE' });
            fetchData();
        }
    }

    fetchData();
</script>

</body>
</html>
